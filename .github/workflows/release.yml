name: Release

# Pushing a version tag (v1.0.0, v1.0.1, ...) builds installers for all
# platforms and publishes them to a GitHub Release.
# Manual runs (workflow_dispatch) build installers and attach them to the
# workflow run as artifacts — handy for testing a release before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            builder_args: --mac --x64 --arm64
          - os: windows-latest
            builder_args: --win
          - os: ubuntu-latest
            builder_args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build renderer/main bundles
        run: npm run build

      # Tag push → publish installers to a GitHub Release named after the tag
      - name: Package and publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificates configured — build unsigned rather
          # than fail looking for an identity
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Manual run → attach installers to the workflow run for testing
      - name: Package (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder ${{ matrix.builder_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload test artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: markora-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
